[tox]
envlist = py310,py311,py312,py313,py314

[gh-actions]
python =
    3.10: py310
    3.11: py311
    3.12: py312
    3.13: py313
    3.14: py314

[testenv]
commands = coverage run --source commercetools --parallel -m pytest {posargs}
extras = test

[testenv:coverage-report]
basepython = python3.13
deps = coverage[toml]
skip_install = true
commands =
    coverage combine
    coverage xml
    coverage report

[testenv:format]
basepython = python3.13
deps =
    black==24.3.0
    isort[toml]==5.10.1
skip_install = true
commands =
    isort --check-only src tests
    black --check src/ tests/
